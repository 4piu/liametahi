# Copy this to your platform config path (see the README's Quickstart) and
# fill in real credentials. This file holds secrets once you do: chmod it
# 600, and `liametahi config check` will refuse to load it otherwise.
#
# This example screens every inbox message with a fast decision model
# (jev); anything it's confident is spam gets trashed, and anything it's
# unsure about is handed off to a second task that asks a slower chat
# model to look at the body before deciding. See docs/configuration.md
# for the full key reference.

version: 1

accounts:
  personal:
    host: imap.gmail.com
    port: 993
    username: you@gmail.com
    password: "an app password, not your real one"
    trash_mailbox: "[Gmail]/Trash"

models:
  # A jev decision model: fast and cheap, one HTTP call per message.
  jev-primary:
    provider: jev
    base_url: https://api.typesafe.ai/v1/systemone
    api_key: "${TYPESAFE_API_KEY}"
    model: jev-latest
    mails_per_request: 1
    max_concurrent_requests: 8

  # An ordinary chat model, for the slower, body-reading second pass.
  local:
    provider: openai_compatible
    base_url: http://127.0.0.1:8080/v1/chat/completions
    model: qwen2.5-7b-instruct

processors:
  # Asked about every message in inbox-classify.
  spam-category:
    model: jev-primary
    type: choice
    question: "Is this email spam or a personal/legitimate message?"
    options:
      spam: "Unsolicited bulk mail, phishing, or scam content"
      personal: "A legitimate message, whether personal or business"

  # Only asked about messages routed to inbox-review below.
  spam-review:
    model: local
    type: noul
    include_body: true
    criteria:
      "true": "This message is spam: unsolicited bulk mail, phishing, or a scam."
      "false": "This message is a legitimate message that should be kept."

tasks:
  inbox-classify:
    account: personal
    source_mailboxes: [INBOX]
    protect:
      flags: ['\Flagged', '\Answered']
      unread: true
    rules:
      # Confident spam: trash outright, no local backup.
      - when:
          - processor: "spam-category.value == spam"
          - processor: "spam-category.confidence >= 0.85"
          - in-mailbox: INBOX
        actions: [trash]

      # Not confident: hand off to inbox-review for a closer look.
      - when:
          - processor: "spam-category.confidence < 0.85"
        actions: [task:inbox-review]

      # Plain cleanup rule, no model involved.
      - when:
          - older-than: 30d
          - list-id-contains: digest
        actions: [backup, trash]

  # Reached only via inbox-classify's task: action above -- no mailbox
  # of its own to scan.
  inbox-review:
    account: personal
    rules:
      - when:
          - processor: "spam-review.value == true"
          - in-mailbox: INBOX
        actions: [backup, trash]
